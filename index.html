<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fifi, foca cea flămândă – în curând</title>
<meta name="description" content="Joc logopedic gratuit pentru sunetul F, creat de prof. logoped Manuela Surlea. Vine în curând!">
<meta property="og:title" content="Fifi, foca cea flămândă – vine în curând!">
<meta property="og:description" content="Joc logopedic gratuit pentru sunetul F, pentru logopezi și părinți.">
<meta property="og:image" content="https://surleamanuela-logo.github.io/joc-foca/fifi.webp">
<meta property="og:type" content="website">
<style>
  @font-face { font-family: Fredoka; src: url(fredoka0.woff2) format('woff2'); font-weight: 300 700; }
  @font-face { font-family: Fredoka; src: url(fredoka1.woff2) format('woff2'); font-weight: 300 700; unicode-range: U+0100-024F, U+0259, U+1E00-1EFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: Fredoka, 'Arial Rounded MT Bold', sans-serif; color: #0d4f86; background: #cfeefa url(fundal.webp) center / cover no-repeat;
    display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: rgba(255,255,255,.9); border: 6px solid #a8e2f5; border-radius: 36px; box-shadow: 0 12px 0 rgba(13,79,134,.15);
    max-width: 560px; width: 100%; padding: 24px 24px 20px; text-align: center; }
  img { width: auto; height: min(300px, 34vh); max-width: 70vw; display: block; margin: -4px auto 8px; animation: hop 2.4s ease-in-out infinite; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  h1 { font-size: clamp(40px, 11vw, 64px); line-height: 1; color: #fff; -webkit-text-stroke: 8px #0d4f86; paint-order: stroke fill; }
  .sub { font-size: clamp(20px, 5.5vw, 28px); font-weight: 600; margin-top: 4px; }
  .sub b { color: #e5383b; }
  .curand { display: inline-block; margin: 14px 0 12px; background: #f06418; color: #fff; font-size: clamp(22px, 6vw, 30px); font-weight: 700;
    border-radius: 999px; padding: 10px 26px; }
  p { font-size: 18px; line-height: 1.35; }
  .autor { margin-top: 14px; padding-top: 12px; border-top: 3px solid #a8e2f5; font-weight: 700; font-size: 19px; }
  .autor small { display: block; font-weight: 500; font-size: 15px; color: #4e6a93; margin-top: 4px; }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } }
</style>
</head>
<body>
  <main class="card">
    <img src="fifi.webp" alt="Fifi, foca cu șapcă colorată, face cu lăbuța">
    <h1>Fifi</h1>
    <div class="sub">foca cea flămândă · joc pentru <span style="white-space:nowrap">sunetul <b>F</b></span></div>
    <div class="curand">Jocul vine în curând!</div>
    <p>Un joc logopedic gratuit, pentru logopezi și părinți: silabe, cuvinte, propoziții și auz fonematic, alături de Fifi și prietenii ei.</p>
    <div class="autor">prof. logoped Manuela Surlea<small>Joc gratuit · nu colectează date personale</small></div>
  </main>
</body>
</html>
